aid: ace-green-recycling
name: ACE Green Recycling
description: >-
  ACE Green Recycling, Inc. is a US-headquartered battery recycling technology company that develops
  and licenses electrified, hydrometallurgical processes for recovering critical materials from
  end-of-life lead-acid and lithium-ion batteries. Its proprietary GREENLEAD process produces
  battery-grade lead, and its LithiumFirst process recovers lithium carbonate, graphite, NMC and MHP
  precursors, cobalt, nickel and copper salts from LFP, NMC and LTO chemistries, all at zero Scope 1
  emissions. ACE operates commercial lead and lithium plants in India and Taiwan, licenses its
  technology to existing recyclers internationally, and is building its own advanced recycling
  operations in the United States. The company announced a NASDAQ listing and $32M in PIPE funding
  in 2026. ACE is an industrial process and materials technology company; it publishes no public
  API, developer portal, SDK or machine-readable specification.
